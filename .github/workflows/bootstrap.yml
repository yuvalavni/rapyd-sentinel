name: bootstrap

# One-time (or rare) apply using the challenge IAM user credentials.
# Creates S3 state bucket + sentinel-gha role.
# GitHub OIDC provider is looked up (CreateOpenIDConnectProvider is denied).
# DynamoDB locking is omitted (CreateTable is denied); GHA concurrency is the lock.

on:
  workflow_dispatch:
    inputs:
      create_oidc_provider:
        description: "Create the GitHub OIDC provider (false if one already exists)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sentinel-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: bootstrap-oidc-and-state
    runs-on: ubuntu-latest
    environment: bootstrap
    defaults:
      run:
        working-directory: bootstrap
    env:
      AWS_REGION: us-east-2
      TF_IN_AUTOMATION: "true"
      TF_VAR_github_org: ${{ github.repository_owner }}
      TF_VAR_github_repo: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Require bootstrap IAM user secrets
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "${KEY_ID}" ]; then
            echo "Set GitHub secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (challenge IAM user)."
            echo "These are used only for this bootstrap workflow."
            exit 1
          fi

      - name: Configure AWS credentials (IAM user, bootstrap only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Inspect GitHub OIDC provider (ClientIDList is critical for OIDC auth)
        run: |
          OIDC_ARN=$(aws iam list-open-id-connect-providers \
            --query "OpenIDConnectProviderList[?ends_with(Arn,'token.actions.githubusercontent.com')].Arn" \
            --output text)
          echo "OIDC Provider ARN: ${OIDC_ARN}"
          if [ -n "${OIDC_ARN}" ]; then
            aws iam get-open-id-connect-provider \
              --open-id-connect-provider-arn "${OIDC_ARN}" \
              --query '{ClientIDList: ClientIDList, ThumbprintList: ThumbprintList}'
          else
            echo "No GitHub OIDC provider found!"
          fi

      - name: terraform fmt
        working-directory: .
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate

      - name: Restore bootstrap state from S3 if present
        run: |
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET="sentinel-tfstate-${ACCOUNT}-us-east-2"
          aws s3 cp "s3://${BUCKET}/bootstrap/terraform.tfstate" terraform.tfstate \
            && echo "Restored bootstrap state" \
            || echo "No prior bootstrap state (first run)"

      - name: Import S3 bucket if it already exists outside state
        run: |
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET="sentinel-tfstate-${ACCOUNT}-us-east-2"
          if aws s3api head-bucket --bucket "${BUCKET}" 2>/dev/null; then
            terraform state show aws_s3_bucket.state >/dev/null 2>&1 || terraform import -input=false aws_s3_bucket.state "${BUCKET}"
            terraform state show aws_s3_bucket_versioning.state >/dev/null 2>&1 || terraform import -input=false aws_s3_bucket_versioning.state "${BUCKET}"
            terraform state show aws_s3_bucket_server_side_encryption_configuration.state >/dev/null 2>&1 || terraform import -input=false aws_s3_bucket_server_side_encryption_configuration.state "${BUCKET}"
            terraform state show aws_s3_bucket_public_access_block.state >/dev/null 2>&1 || terraform import -input=false aws_s3_bucket_public_access_block.state "${BUCKET}"
          fi

      - name: terraform apply
        run: terraform apply -input=false -auto-approve

      - name: Persist bootstrap state
        run: |
          ACCOUNT="$(terraform output -raw aws_account_id)"
          BUCKET="$(terraform output -raw state_bucket)"
          aws s3 cp terraform.tfstate "s3://${BUCKET}/bootstrap/terraform.tfstate"

      - name: Print outputs (no secrets)
        run: |
          echo "AWS_ACCOUNT_ID=$(terraform output -raw aws_account_id)"
          echo "TF_STATE_BUCKET=$(terraform output -raw state_bucket)"
          echo "GHA_ROLE_ARN=$(terraform output -raw gha_ci_role_arn)"
          echo "GHA_CI2_ROLE_ARN=$(terraform output -raw gha_ci2_role_arn)"
          echo
          echo "Set GitHub Actions variables:"
          echo "  AWS_ACCOUNT_ID = $(terraform output -raw aws_account_id)"
          echo "deploy.yml assumes role sentinel-gha-ci2 (new GitHub OIDC sub format) via OIDC."
