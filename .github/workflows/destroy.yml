name: destroy

# DANGER: tears down ALL infrastructure in environments/sentinel.
# Correct order:
#   1. Delete k8s namespaces so the cloud controller can remove NLBs from AWS.
#   2. Wait for NLBs to disappear (otherwise VPC destroy fails on dependency).
#   3. terraform destroy.
#
# Type "destroy" in the confirmation input to proceed.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'destroy' to confirm full teardown"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: sentinel-us-east-2   # same lock as deploy — never run in parallel
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  GHA_ROLE_NAME: sentinel-gha-ci3
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.9.8"

jobs:
  guard:
    name: confirmation-guard
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy" ]; then
            echo "::error::You must type 'destroy' to confirm. Got: '${{ github.event.inputs.confirm }}'"
            exit 1
          fi
          echo "Confirmation received. Proceeding with teardown."

  cleanup-k8s:
    name: cleanup-k8s-and-nlbs
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.GHA_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4

      - name: Check whether clusters exist
        id: clusters
        run: |
          backend_exists=false
          gateway_exists=false
          aws eks describe-cluster --name eks-backend  --region "$AWS_REGION" &>/dev/null && backend_exists=true  || true
          aws eks describe-cluster --name eks-gateway  --region "$AWS_REGION" &>/dev/null && gateway_exists=true || true
          echo "backend_exists=${backend_exists}"  >> "$GITHUB_OUTPUT"
          echo "gateway_exists=${gateway_exists}" >> "$GITHUB_OUTPUT"

      - name: Delete sentinel-backend namespace (removes internal NLB)
        if: steps.clusters.outputs.backend_exists == 'true'
        run: |
          aws eks update-kubeconfig \
            --name eks-backend --region "$AWS_REGION" \
            --kubeconfig "$HOME/.kube/sentinel-backend"
          export KUBECONFIG="$HOME/.kube/sentinel-backend"
          kubectl wait node --all --for=condition=Ready --timeout=120s || true
          kubectl delete namespace sentinel-backend --ignore-not-found --timeout=120s || true

      - name: Delete sentinel-gateway namespace (removes public NLB)
        if: steps.clusters.outputs.gateway_exists == 'true'
        run: |
          aws eks update-kubeconfig \
            --name eks-gateway --region "$AWS_REGION" \
            --kubeconfig "$HOME/.kube/sentinel-gateway"
          export KUBECONFIG="$HOME/.kube/sentinel-gateway"
          kubectl wait node --all --for=condition=Ready --timeout=120s || true
          kubectl delete namespace sentinel-gateway --ignore-not-found --timeout=120s || true

      - name: Wait for NLBs to be removed from AWS (up to 5 min)
        run: |
          echo "Waiting for load balancers tagged with Project=rapyd-sentinel to be gone..."
          for i in $(seq 1 30); do
            count=$(aws elbv2 describe-load-balancers --region "$AWS_REGION" \
              --query "LoadBalancers[?contains(LoadBalancerName,'eks-backend') || contains(LoadBalancerName,'eks-gateway')] | length(@)" \
              --output text 2>/dev/null || echo 0)
            echo "  attempt ${i}/30: ${count} LBs remaining"
            [ "${count}" -eq 0 ] && echo "All NLBs removed." && exit 0
            sleep 10
          done
          echo "Warning: some NLBs may still exist; terraform destroy will attempt to continue."

  destroy:
    name: terraform-destroy
    needs: cleanup-k8s
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: environments/sentinel
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.GHA_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Require AWS_ACCOUNT_ID
        run: |
          if [ -z "${{ vars.AWS_ACCOUNT_ID }}" ]; then
            echo "Set Actions variable AWS_ACCOUNT_ID, then re-run."
            exit 1
          fi

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=sentinel-tfstate-${{ vars.AWS_ACCOUNT_ID }}-${{ env.AWS_REGION }}" \
            -backend-config="key=sentinel/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: terraform destroy
        run: terraform destroy -input=false -auto-approve
