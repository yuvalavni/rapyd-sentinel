worker_processes 1;
error_log /tmp/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /tmp/access.log;
    sendfile      on;
    keepalive_timeout 65;
    include       /tmp/default.conf;
}
